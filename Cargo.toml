[package]
name = "dangvan"
version = "0.1.0"
edition = "2021"
description = "Analyse de fatigue multiaxiale selon le critère de Dang Van"
license = "MIT"

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "dangvan"
path = "src/bin/dangvan.rs"

[[bin]]
name = "dangvan-gui"
path = "src/bin/gui.rs"

[dependencies]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[workspace]
resolver = "2"
